name: prospection

on:
  schedule:
    # Lundi à vendredi, 05:00 UTC = 09:00 heure de Maurice (UTC+4)
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospection
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Simulation par défaut. Envoi réel : DRY_RUN=false, LIVE_SEND=true, ADM_VALIDES=true, SMTP_TESTED=true (variables de dépôt).
      DRY_RUN: ${{ vars.DRY_RUN }}
      LIVE_SEND: ${{ vars.LIVE_SEND }}
      ADM_VALIDES: ${{ vars.ADM_VALIDES }}
      SMTP_TESTED: ${{ vars.SMTP_TESTED }}
      FROM_ADDR: ${{ vars.FROM_ADDR }}
      FROM_NAME: ${{ vars.FROM_NAME }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_LOGIN: ${{ secrets.SMTP_USER }}
      SMTP_KEY: ${{ secrets.SMTP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BASE_CONTACTS_PASSPHRASE: ${{ secrets.BASE_CONTACTS_PASSPHRASE }}
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      SORTIE_SIMULATION: ${{ github.workspace }}/data/simulations
      DONNEES_DIR: ${{ github.workspace }}/data
    steps:
      - name: Garde-fous
        run: |
          set -euo pipefail
          DRY_RUN="${DRY_RUN:-true}"
          LIVE_SEND="${LIVE_SEND:-false}"
          echo "DRY_RUN=$DRY_RUN LIVE_SEND=$LIVE_SEND ADM_VALIDES=${ADM_VALIDES:-} SMTP_TESTED=${SMTP_TESTED:-}"
          if [ "$LIVE_SEND" = "true" ]; then
            if [ "$DRY_RUN" != "false" ] || [ "${ADM_VALIDES:-}" != "true" ] || [ "${SMTP_TESTED:-}" != "true" ]; then
              echo "Envoi réel demandé sans les conditions requises. Arrêt."
              exit 1
            fi
          fi
          if [ -z "${DATA_REPO_TOKEN:-}" ]; then
            echo "DATA_REPO_TOKEN absent : les données de prospection ne peuvent pas être lues. Arrêt."
            exit 1
          fi

      - name: Code du dépôt (sans identifiants persistés)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dépôt privé des données
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/ajeaneudesc-blip/agence-sas-donnees.git" data
          if [ -f data/contacts.db.enc ]; then
            cp data/contacts.db.enc Administratif/Prospection/contacts.db.enc
            echo "Base chiffrée récupérée."
          else
            echo "Pas encore de base chiffrée : elle sera créée."
          fi

      - name: Python et dépendances
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic sqlcipher3-binary

      - name: Passage
        working-directory: Administratif/Prospection
        run: |
          set -euo pipefail
          if [ -f contacts.db.enc ]; then
            cp contacts.db.enc contacts.db
          else
            python3 base-contacts.py init
          fi
          if [ -f "$GITHUB_WORKSPACE/data/candidats.json" ]; then
            python3 qualifier.py "$GITHUB_WORKSPACE/data/candidats.json" --ecrire
            touch "$GITHUB_WORKSPACE/data/.candidats_importes"
          fi
          python3 lancer.py
          python3 base-contacts.py chiffrer
          cp contacts.db.enc "$GITHUB_WORKSPACE/data/contacts.db.enc"

      - name: Sauvegarde chiffrée dans le dépôt privé
        working-directory: data
        run: |
          set -euo pipefail
          git config user.name "agence-sas-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f .candidats_importes ]; then
            git rm -q candidats.json
            rm -f .candidats_importes
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à sauvegarder."
          else
            git commit -q -m "Passage du $(date -u +%F) (base chiffrée)"
            git push -q origin HEAD:main
          fi
