<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{SUBJECT}}</title>
</head>
<body style="margin:0;padding:0;background-color:#F6F6F6;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F6F6F6;">{{PREHEADER}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F6F6F6;">
<tr><td align="center" style="padding:28px 12px 28px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
<tr><td align="center" style="background-color:#FFFFFF;">
  <!-- Le décalage : orange à gauche, bleu qui prend le relais vers la droite -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
    <td width="38%" height="4" bgcolor="#FF915E" style="height:4px;font-size:0;line-height:0;">&nbsp;</td>
    <td width="62%" height="4" bgcolor="#095CFF" style="height:4px;font-size:0;line-height:0;">&nbsp;</td>
  </tr></table>
  <!-- Illustration de la charte, adaptée à l'offre : le trait se dessine puis la couleur arrive (jouée une fois, puis fixe) -->
  <img src="{{HERO_SRC}}" width="{{HERO_W}}" height="{{HERO_H}}" alt="{{HERO_ALT}}" style="display:block;margin:0 auto;border:0;outline:none;width:100%;max-width:{{HERO_W}}px;height:auto;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
  <td align="center" style="padding:34px 40px 38px 40px;font-family:'Geist','Segoe UI',Helvetica,Arial,sans-serif;text-align:center;">
    <!--LOGO-->
    <img src="{{LOGO_SRC}}" width="{{LOGO_W}}" height="{{LOGO_H}}" alt="Start And Shift, Motion - Web - Video - Com" style="display:block;margin:0 auto;border:0;outline:none;width:{{LOGO_W}}px;height:{{LOGO_H}}px;">
    <div style="height:28px;line-height:28px;font-size:0;">&nbsp;</div>
    <!--/LOGO-->
    <div style="font-family:'Geist','Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;font-weight:400;color:#292929;text-align:center;">{{CORPS}}</div>
    <!--CTA-->
    {{CTA_BLOCK}}
    <!--/CTA-->
    <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin:34px auto 0 auto;"><tr>
      <td align="center" style="font-family:'Geist','Segoe UI',Helvetica,Arial,sans-serif;text-align:center;">
        <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto 12px auto;"><tr>
          <td width="28" height="3" bgcolor="#FF915E" style="width:28px;height:3px;font-size:0;line-height:0;">&nbsp;</td>
          <td width="28" height="3" bgcolor="#095CFF" style="width:28px;height:3px;font-size:0;line-height:0;">&nbsp;</td>
        </tr></table>
        <!--PHOTO--><img src="{{PHOTO_SRC}}" width="56" height="56" alt="Jean Eudes Adakanou" style="display:block;margin:0 auto 10px auto;border:0;outline:none;width:56px;height:56px;border-radius:50%;"><!--/PHOTO-->
        <div style="font-size:15px;line-height:22px;font-weight:600;color:#292929;">Jean Eudes Adakanou</div>
        <div style="font-size:13px;line-height:20px;color:#5A5A5A;">{{ROLE}}</div>
        <div style="font-size:13px;line-height:20px;"><a href="mailto:{{EMAIL}}" style="color:#095CFF;text-decoration:underline;">{{EMAIL}}</a></div>
        <!--SLOGAN--><div style="font-size:12px;line-height:16px;color:#5A5A5A;padding-top:8px;">{{SLOGAN}}</div><!--/SLOGAN-->
      </td>
    </tr></table>
  </td></tr></table>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
